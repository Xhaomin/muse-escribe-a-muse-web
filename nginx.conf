user nginx;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    types {
        text/markdown md;
        application/octet-stream ots;
    }
    default_type application/octet-stream;
    # Solo añade el charset a la cabecera; sin source_charset no recodifica nada.
    charset utf-8;
    charset_types text/css text/plain text/markdown application/json;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;
    gzip on;
    gzip_types text/css text/markdown application/json;

    server {
        listen 8080;
        root /srv/sitios/actual;
        index index.html;
        include /etc/nginx/cabeceras.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Archivos sellados: no cambian nunca una vez publicados.
        location ~ \.(md|ots)$ {
            include /etc/nginx/cabeceras.conf;
            add_header Cache-Control "public, max-age=300" always;
        }

        location / {
            include /etc/nginx/cabeceras.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/ =404;
        }
    }
}
